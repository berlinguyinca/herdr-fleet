---
# Where herdr-engineering lives. Layout is the stage helper's (kept identical to the original
# herdr-engineering helper so the rollout coordinator and its attestations keep working):
#   ~/.local/share/herdr-engineering/herdr/releases/<sha>   immutable checkouts
#   ~/.venvs/herdr-engineering                             venv holding herdr-eng
herdr_engineering_home: "{{ ansible_facts.env.HOME }}"
herdr_engineering_python: python3
herdr_engineering_min_python: "3.12"
herdr_engineering_helper_dir: "{{ herdr_engineering_home }}/.local/share/herdr-fleet/helpers"
herdr_engineering_helper: "{{ herdr_engineering_helper_dir }}/stage_release.py"
herdr_engineering_root: "{{ herdr_engineering_home }}/.local/share/herdr-engineering/herdr"
herdr_engineering_venv: "{{ herdr_engineering_home }}/.venvs/herdr-engineering"
herdr_engineering_entry: "{{ herdr_engineering_venv }}/bin/herdr-eng"
herdr_engineering_bin_dir: "{{ herdr_engineering_home }}/.local/bin"
herdr_engineering_shim: "{{ herdr_engineering_bin_dir }}/herdr-eng"

# Supplied from fleet.lock and fleet-config.yaml by herdr-fleet (extra-vars), never defaulted here:
#   herdr_engineering_revision, herdr_engineering_repository, herdr_engineering_gateway_url,
#   herdr_engineering_control_plane_url (null when not configured), fleet_stage_release_src
