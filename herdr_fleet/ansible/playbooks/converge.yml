---
# One host at a time (serial: 1). Roles are chosen per host from fleet_roles (inventory var).
# Tags select the pass: no tag filter = plan --check, --skip-tags fingerprint = apply,
# --tags fingerprint = verify.
#
# A failed host must not poison the hosts after it. Ansible ends a serial play when a whole batch
# fails, so the work runs in a block whose rescue clears the failure: read-only passes carry on
# with the next host. apply (fleet_fail_fast) is the exception: it re-raises, which stops the run
# before another host is touched; hosts never reached are reported as "not attempted".
- name: Converge the fleet
  hosts: all
  serial: 1
  gather_facts: false
  tasks:
    - name: One host
      block:
        - name: Gather facts
          ansible.builtin.setup:
            gather_subset: ["min", "env"]
          tags: [always]

        # Every role adds its section to this one fact (set_fact + combine); the callback emits the
        # fact on each change and the last event per host is the complete fingerprint.
        - name: Fingerprint base
          ansible.builtin.set_fact:
            fleet_fingerprint:
              system: "{{ ansible_facts.system }}"
              machine: "{{ ansible_facts.architecture }}"
          when: fleet_roles | length > 0
          tags: [fingerprint]

        - name: Role toolchain
          ansible.builtin.include_role:
            name: toolchain
            apply:
              tags: [converge]
          when: "'toolchain' in fleet_roles"
          tags: [converge]

        # Read-only (probes run even in check mode); apply runs it again as its own verify pass.
        - name: Fingerprint
          ansible.builtin.include_role:
            name: toolchain
            tasks_from: fingerprint
            apply:
              tags: [fingerprint]
          tags: [fingerprint]
          when: "'toolchain' in fleet_roles"

        - name: Role herdr
          ansible.builtin.include_role:
            name: herdr
            apply:
              tags: [converge]
          when: "'herdr' in fleet_roles"
          tags: [converge]

        - name: Fingerprint herdr
          ansible.builtin.include_role:
            name: herdr
            tasks_from: fingerprint
            apply:
              tags: [fingerprint]
          tags: [fingerprint]
          when: "'herdr' in fleet_roles"

        - name: Role herdr-engineering
          ansible.builtin.include_role:
            name: herdr-engineering
            apply:
              tags: [converge]
          when: "'herdr-engineering' in fleet_roles"
          tags: [converge]

        - name: Fingerprint herdr-engineering
          ansible.builtin.include_role:
            name: herdr-engineering
            tasks_from: fingerprint
            apply:
              tags: [fingerprint]
          tags: [fingerprint]
          when: "'herdr-engineering' in fleet_roles"

        - name: Role pi-runtime
          ansible.builtin.include_role:
            name: pi-runtime
            apply:
              tags: [converge]
          when: "'pi-runtime' in fleet_roles"
          tags: [converge]

        - name: Fingerprint pi-runtime
          ansible.builtin.include_role:
            name: pi-runtime
            tasks_from: fingerprint
            apply:
              tags: [fingerprint]
          tags: [fingerprint]
          when: "'pi-runtime' in fleet_roles"
      rescue:
        - name: Stop the run at the first failed host
          ansible.builtin.fail:
            msg: apply stops at the first failed host; the remaining hosts were not touched
          when: fleet_fail_fast | default(false) | bool
          tags: [always]
