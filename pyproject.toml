[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-fleet"
version = "0.1.0"
description = "Reproducible, updateable provisioning for a herdr-engineering fleet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "types-PyYAML", "types-jsonschema"]

[project.scripts]
herdr-fleet = "herdr_fleet.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.setuptools.packages.find]
include = ["herdr_fleet*"]

[tool.setuptools.package-data]
herdr_fleet = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=herdr_fleet --cov-branch --cov-report=term-missing --cov-fail-under=80"
